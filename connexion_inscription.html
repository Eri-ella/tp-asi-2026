<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion / Inscription</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #eef2ff, #f8fafc);
      color: #1e293b;
    }
    .container {
      width: 100%;
      max-width: 420px;
      padding: 32px;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 15px 45px rgba(15, 23, 42, .12);
    }
    h1 { margin: 0 0 8px; text-align: center; font-size: 27px; }
    .subtitle { margin: 0 0 25px; text-align: center; color: #64748b; }
    .tabs { display: flex; gap: 8px; margin-bottom: 24px; }
    .tabs button {
      flex: 1; padding: 11px; border: 0; border-radius: 9px;
      background: #e2e8f0; color: #475569; cursor: pointer; font-weight: 700;
    }
    .tabs button.active { background: #4f46e5; color: white; }
    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 7px; font-size: 14px; font-weight: 700; }
    input {
      width: 100%; padding: 12px 13px; border: 1px solid #cbd5e1;
      border-radius: 9px; font-size: 15px; outline: none;
    }
    input:focus { border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79,70,229,.12); }
    .submit {
      width: 100%; margin-top: 7px; padding: 13px; border: 0;
      border-radius: 9px; background: #4f46e5; color: white;
      font-size: 16px; font-weight: 700; cursor: pointer;
    }
    .submit:hover { background: #4338ca; }
    .message { min-height: 20px; margin: 15px 0 0; text-align: center; font-size: 14px; }
    .success { color: #15803d; }
    .error { color: #dc2626; }
    .hidden { display: none; }
    .note { margin-top: 20px; color: #94a3b8; font-size: 12px; line-height: 1.5; text-align: center; }
  </style>
</head>
<body>
  <main class="container">
    <h1>Bienvenue</h1>
    <p class="subtitle">Connectez-vous ou créez votre compte</p>

    <div class="tabs">
      <button type="button" id="loginTab" class="active">Connexion</button>
      <button type="button" id="signupTab">Inscription</button>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label for="loginEmail">Adresse e-mail</label>
        <input type="email" id="loginEmail" autocomplete="email" placeholder="exemple@email.com" required>
      </div>
      <div class="form-group">
        <label for="loginPassword">Mot de passe</label>
        <input type="password" id="loginPassword" autocomplete="current-password" placeholder="Votre mot de passe" required>
      </div>
      <button class="submit" type="submit">Se connecter</button>
    </form>

    <form id="signupForm" class="hidden">
      <div class="form-group">
        <label for="signupName">Nom complet</label>
        <input type="text" id="signupName" autocomplete="name" placeholder="Votre nom" required minlength="2">
      </div>
      <div class="form-group">
        <label for="signupEmail">Adresse e-mail</label>
        <input type="email" id="signupEmail" autocomplete="email" placeholder="exemple@email.com" required>
      </div>
      <div class="form-group">
        <label for="signupPassword">Mot de passe</label>
        <input type="password" id="signupPassword" autocomplete="new-password" placeholder="Au moins 8 caractères" required minlength="8">
      </div>
      <div class="form-group">
        <label for="confirmPassword">Confirmer le mot de passe</label>
        <input type="password" id="confirmPassword" autocomplete="new-password" placeholder="Répétez le mot de passe" required minlength="8">
      </div>
      <button class="submit" type="submit">Créer mon compte</button>
    </form>

    <p id="message" class="message" role="status" aria-live="polite"></p>
    <p class="note">Démo pédagogique : les comptes sont stockés dans le navigateur. Ne l'utilisez pas pour de vrais utilisateurs.</p>
  </main>

  <script>
    const loginTab = document.getElementById("loginTab");
    const signupTab = document.getElementById("signupTab");
    const loginForm = document.getElementById("loginForm");
    const signupForm = document.getElementById("signupForm");
    const message = document.getElementById("message");

    function showMessage(text, type) {
      message.textContent = text;
      message.className = "message " + type;
    }

    function switchForm(mode) {
      const isLogin = mode === "login";
      loginForm.classList.toggle("hidden", !isLogin);
      signupForm.classList.toggle("hidden", isLogin);
      loginTab.classList.toggle("active", isLogin);
      signupTab.classList.toggle("active", !isLogin);
      showMessage("", "");
    }

    loginTab.addEventListener("click", () => switchForm("login"));
    signupTab.addEventListener("click", () => switchForm("signup"));

    // Démonstration uniquement : localStorage n'est pas sécurisé pour stocker des mots de passe.
    function getUsers() {
      return JSON.parse(localStorage.getItem("demoUsers") || "[]");
    }

    signupForm.addEventListener("submit", (event) => {
      event.preventDefault();

      const name = document.getElementById("signupName").value.trim();
      const email = document.getElementById("signupEmail").value.trim().toLowerCase();
      const password = document.getElementById("signupPassword").value;
      const confirmation = document.getElementById("confirmPassword").value;

      if (password !== confirmation) {
        showMessage("Les deux mots de passe ne correspondent pas.", "error");
        return;
      }

      const users = getUsers();
      if (users.some(user => user.email === email)) {
        showMessage("Un compte existe déjà avec cette adresse e-mail.", "error");
        return;
      }

      // Pour une vraie application, l'inscription doit être traitée par un serveur.
      users.push({ name, email, password });
      localStorage.setItem("demoUsers", JSON.stringify(users));

      signupForm.reset();
      showMessage("Compte créé avec succès. Vous pouvez vous connecter.", "success");
      switchForm("login");
      document.getElementById("loginEmail").value = email;
    });

    loginForm.addEventListener("submit", (event) => {
      event.preventDefault();

      const email = document.getElementById("loginEmail").value.trim().toLowerCase();
      const password = document.getElementById("loginPassword").value;
      const user = getUsers().find(item => item.email === email && item.password === password);

      if (!user) {
        showMessage("Adresse e-mail ou mot de passe incorrect.", "error");
        return;
      }

      showMessage("Bienvenue, " + user.name + " ! Connexion réussie (démo).", "success");
      loginForm.reset();
    });
  </script>
</body>
</html>
